name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job below is a thin wrapper around a script under scripts/ that can
# also be run locally with `npm test` (or individually with
# `node scripts/check-*.mjs`). No step here does anything a contributor can't
# reproduce on their own machine before pushing.

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # check-hook-behavior.mjs FAILS in CI without jq, by design: without it the
      # jq branch of subagent-dispatch-log.sh never runs and the check could not
      # claim to have covered it. ubuntu-latest ships jq today, but that is the
      # runner image's choice, not this repo's; this step makes it a declared
      # dependency. It is a no-op when jq is already there.
      - name: Ensure jq (both parsers of the sh hook must run)
        run: |
          command -v jq >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y jq; }
          jq --version

      - name: Skill frontmatter validity
        run: node scripts/check-skill-frontmatter.mjs

      - name: Plugin manifest validity
        run: node scripts/check-manifests.mjs

      - name: Node syntax check (.mjs)
        run: node scripts/check-node-syntax.mjs

      - name: Hook shell syntax (sh -n, CRLF, BOM)
        run: node scripts/check-hook-syntax.mjs

      - name: Hook behavior (never blocks, never writes stdout)
        run: node scripts/check-hook-behavior.mjs

      - name: Outcome backfill (stopHint split has a consumer)
        run: node scripts/check-outcome-backfill.mjs

      - name: Pricing sanity
        run: node scripts/check-pricing.mjs

      - name: Benchmark harness (bash syntax, clean-room guards fire)
        run: node scripts/check-benchmark-scripts.mjs

      - name: Internal link check
        run: node scripts/check-links.mjs

      - name: README repo tree matches disk
        run: node scripts/check-readme-tree.mjs
